<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>炫彩粒子爱心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    touch-action:none;
    overscroll-behavior:none;
}
canvas{
    display:block;
    width:100vw;
    height:100vh;
}
#video{
    position:fixed;
    top:16px;
    right:16px;
    width:180px;
    border:none;
    border-radius:8px;
    transform:scaleX(-1);
    opacity:0;
    pointer-events:none;
    z-index:0;
}
.tip{
    position:fixed;
    bottom:24px;
    left:0;
    width:100%;
    text-align:center;
    color:rgba(255,255,255,0.5);
    font-size:13px;
    z-index:1;
    pointer-events:none;
}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div class="tip">手掌靠近缩小，远离放大</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.14.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('video');

let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resizeCanvas(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// 高密度爱心粒子，取消额外外围颗粒
let heartParticles = [];
const heartCount = 4200;
let scaleFactor = 14;
let targetScale = 14;

// 明亮粉紫霓虹主色，参考图那种高亮感
function createHeartParticles(){
    heartParticles = [];
    for(let i = 0; i < heartCount; i++){
        const t = Math.random() * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));

        // 心形边缘更散，中间更密，模拟参考图的颗粒堆积
        const noise = Math.random();
        const spread = noise < 0.35 ? Math.random() * 1.2 : Math.random() * 2.2;

        heartParticles.push({
            baseX: x + (Math.random() - 0.5) * spread,
            baseY: y + (Math.random() - 0.5) * spread,
            x: x,
            y: y,
            offset: Math.random() * 360,
            size: Math.random() * 1.7 + 0.5,
            bright: 0.75 + Math.random() * 0.25
        })
    }
}

createHeartParticles();

// 摄像头 & 手势识别
let handModel = null;
let lastDist = null;

async function loadHandModel(){
    console.log("加载手部识别模型...");
    try{
        handModel = await handpose.load();
        console.log("模型加载完成");
        detectHand();
    }catch(err){
        console.error("模型加载失败", err);
        alert("手部模型加载失败，请切换网络或使用手机访问");
    }
}

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = async ()=>{
            await video.play();
            await loadHandModel();
        }
    } catch(err) {
        alert("摄像头权限被拒绝：" + err.name + "，请检查浏览器和系统相机权限");
        console.error("摄像头错误：", err);
    }
}

// 高灵敏手势识别，低延迟
async function detectHand(){
    if(!handModel) return;
    try{
        const predictions = await handModel.estimateHands(video);
        if(predictions.length > 0){
            const hand = predictions[0];
            
            // 用多指综合距离判断远近，手机端更稳
            const wrist = hand.landmarks[0];
            const thumbTip = hand.landmarks[4];
            const middleTip = hand.landmarks[12];
            const pinkyTip = hand.landmarks[20];

            const d1 = Math.hypot(thumbTip[0] - wrist[0], thumbTip[1] - wrist[1]);
            const d2 = Math.hypot(middleTip[0] - wrist[0], middleTip[1] - wrist[1]);
            const d3 = Math.hypot(pinkyTip[0] - wrist[0], pinkyTip[1] - wrist[1]);

            const avgDist = (d1 + d2 + d3) / 3;

            // 平滑过滤，减少抖动，但保持响应速度
            if(lastDist === null){
                lastDist = avgDist;
            }else{
                lastDist = lastDist * 0.4 + avgDist * 0.6;
            }

            // 手近 → 爱心缩小；手远 → 爱心变大
            targetScale = Math.max(7, Math.min(24, lastDist / 4.5));
        }else{
            lastDist = null;
            targetScale = 14;
        }
    }catch(err){
        console.warn("手部检测异常", err);
        lastDist = null;
        targetScale = 14;
    }
    requestAnimationFrame(detectHand);
}

// 明亮粉紫霓虹颜色
function neonPinkColor(offset){
    const progress = (offset + Date.now() * 0.04) % 360;
    const i = progress / 360;

    // 主色范围：亮粉 → 玫红 → 紫 → 蓝紫，局部穿插高光
    let r, g, b;

    if(i < 0.4){
        // 亮粉到玫红
        r = 255;
        g = Math.floor(80 + i * 200);
        b = Math.floor(180 - i * 200);
    }else if(i < 0.75){
        // 玫红到紫
        r = 255;
        g = Math.floor(160 - (i - 0.4) * 400);
        b = Math.floor(100 + (i - 0.4) * 400);
    }else{
        // 蓝紫到亮粉
        r = Math.floor(180 + (i - 0.75) * 300);
        g = Math.floor(60 + (i - 0.75) * 120);
        b = 255;
    }

    // 高光随机提亮
    const highlight = Math.random();
    if(highlight > 0.88){
        r = Math.min(255, r + 60);
        g = Math.min(255, g + 60);
        b = Math.min(255, b + 60);
    }

    return { r, g, b };
}

function animate(){
    // 更快响应缩放
    scaleFactor += (targetScale - scaleFactor) * 0.25;

    // 拖尾更干净，突出明亮爱心
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    // 爱心主体
    heartParticles.forEach(p=>{
        p.x = centerX + p.baseX * scaleFactor;
        p.y = centerY + p.baseY * scaleFactor;

        const color = neonPinkColor(p.offset);

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgb(${color.r},${color.g},${color.b})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = `rgb(${color.r},${color.g},${color.b})`;
        ctx.fill();
    });

    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}

startCamera();
animate();
</script>
</body>
</html>
