<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>炫彩粒子爱心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    touch-action:none;
    overscroll-behavior:none;
}
canvas{
    display:block;
    width:100vw;
    height:100vh;
}
#video{
    position:fixed;
    top:16px;
    right:16px;
    width:180px;
    border:none;
    border-radius:8px;
    transform:scaleX(-1);
    opacity:0;
    pointer-events:none;
    z-index:0;
}
.tip{
    position:fixed;
    bottom:24px;
    left:0;
    width:100%;
    text-align:center;
    color:rgba(255,255,255,0.6);
    font-size:13px;
    z-index:1;
    pointer-events:none;
    transition: opacity 1s;
}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div class="tip">手掌靠近缩小，远离放大</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.14.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const video = document.getElementById('video');
const tipDom = document.querySelector('.tip');

// 2秒后提示文字淡出
setTimeout(()=>{
    tipDom.style.opacity = "0";
},2000);

let dpr = Math.min(window.devicePixelRatio || 1, 2);
function resizeCanvas(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let heartParticles = [];
const heartCount = 4200;
let scaleFactor = 14;
let targetScale = 14;

// 实心心形粒子生成（内部填充，还原参考图饱满效果）
function createHeartParticles(){
    heartParticles = [];
    for(let i = 0; i < heartCount; i++){
        let x, y;
        // 心形内部随机采样
        while(true){
            const t = Math.random() * Math.PI * 2;
            const baseX = 16 * Math.pow(Math.sin(t), 3);
            const baseY = -(13 * Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
            const r = Math.sqrt(Math.random());
            x = baseX * r;
            y = baseY * r;
            break;
        }
        const noise = Math.random();
        const spread = noise < 0.35 ? Math.random() * 1.2 : Math.random() * 2.2;
        heartParticles.push({
            baseX: x + (Math.random() - 0.5) * spread,
            baseY: y + (Math.random() - 0.5) * spread,
            x: x,
            y: y,
            offset: Math.random() * 360,
            size: Math.random() * 1.7 + 0.5,
            bright: 0.75 + Math.random() * 0.25
        })
    }
}
createHeartParticles();

// 明亮粉紫霓虹配色
function neonPinkColor(offset){
    const progress = (offset + Date.now() * 0.04) % 360;
    const i = progress / 360;
    let r, g, b;
    if(i < 0.4){
        r = 255;
        g = Math.floor(80 + i * 200);
        b = Math.floor(180 - i * 200);
    }else if(i < 0.75){
        r = 255;
        g = Math.floor(160 - (i - 0.4) * 400);
        b = Math.floor(100 + (i - 0.4) * 400);
    }else{
        r = Math.floor(180 + (i - 0.75) * 300);
        g = Math.floor(60 + (i - 0.75) * 120);
        b = 255;
    }
    const highlight = Math.random();
    if(highlight > 0.88){
        r = Math.min(255, r + 60);
        g = Math.min(255, g + 60);
        b = Math.min(255, b + 60);
    }
    return { r, g, b };
}

// 手势识别
let handModel = null;
let lastDist = null;
async function loadHandModel(){
    console.log("加载手部模型...");
    handModel = await handpose.load();
    console.log("模型加载完成");
    detectHandLoop();
}
async function startCamera(){
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: false
        });
        video.srcObject = stream;
        await video.play();
        await loadHandModel();
    }catch(err){
        console.error("摄像头启动失败", err);
    }
}
async function detectHandLoop(){
    if(!handModel) return;
    const predictions = await handModel.estimateHands(video);
    if(predictions.length > 0){
        const hand = predictions[0];
        const wrist = hand.landmarks[0];
        const thumbTip = hand.landmarks[4];
        const middleTip = hand.landmarks[12];
        const pinkyTip = hand.landmarks[20];

        const d1 = Math.hypot(thumbTip[0]-wrist[0], thumbTip[1]-wrist[1]);
        const d2 = Math.hypot(middleTip[0]-wrist[0], middleTip[1]-wrist[1]);
        const d3 = Math.hypot(pinkyTip[0]-wrist[0], pinkyTip[1]-wrist[1]);
        const avgDist = (d1 + d2 + d3) / 3;

        if(lastDist === null){
            lastDist = avgDist;
        }else{
            lastDist = lastDist * 0.4 + avgDist * 0.6;
        }
        targetScale = Math.max(7, Math.min(24, lastDist / 4.5));
    }else{
        lastDist = null;
        targetScale = 14;
    }
    requestAnimationFrame(detectHandLoop);
}

// 渲染循环
function renderLoop(){
    scaleFactor += (targetScale - scaleFactor) * 0.25;
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(0,0,window.innerWidth, window.innerHeight);

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;

    heartParticles.forEach(p=>{
        p.x = cx + p.baseX * scaleFactor;
        p.y = cy + p.baseY * scaleFactor;
        const color = neonPinkColor(p.offset);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fillStyle = `rgb(${color.r},${color.g},${color.b})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = `rgb(${color.r},${color.g},${color.b})`;
        ctx.fill();
    });
    ctx.shadowBlur = 0;
    requestAnimationFrame(renderLoop);
}

startCamera();
renderLoop();
</script>
</body>
</html>
